<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso administrador — SaludHogar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/images/logo-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card zoom-in">
    <div class="login-card__logo">
      <img src="assets/images/logo-icon.svg" alt="Logo SaludHogar">
      <span>Salud Hogar</span>
    </div>
    <h1>Panel de administración</h1>
    <p>Ingresa con tu cuenta de administrador.</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" required autocomplete="username" placeholder="admin@saludhogar.pe">
      </div>
      <div class="field">
        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" id="login-submit" class="btn btn-primary btn-wide">Ingresar</button>
    </form>

    <p class="login-footnote">Acceso restringido — SaludHogar &copy; 2026</p>
  </div>
</div>

<script type="module" src="js/auth/login-form.js"></script>
</body>
</html>
